<!doctype html>
<html lang="en" id="html-root">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flux | Settings</title>
  <link rel="icon" type="image/png" href="FluxLogo.png">

  <style>
    :root { --bg:#0f1320; --panel:#1a2033; --accent:#6aa8ff; --text:#e8eefc; --muted:#aab4d4; }
    * { box-sizing:border-box }
    html, body { height:100%; }
    body {
      margin:0; background:var(--bg); color:var(--text);
      font:14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", Arial, sans-serif;
      display:flex; flex-direction:column;
    }

    /* Top bar */
    #topbar {
      display:flex; align-items:center; gap:10px; padding:10px 16px;
      background:linear-gradient(90deg, #151a2a, #1b2338);
      border-bottom:1px solid #202a43; position:sticky; top:0; z-index:50;
    }
    #topbar-logo { width:28px; height:28px; border-radius:6px; background:#263355; display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--accent); }
    #topbar-title { font-size:15px; font-weight:600 }
    #topbar-spacer { flex:1 }
    .top-btn {
      background:#253154; border:0; color:var(--text); padding:8px 10px; border-radius:8px; cursor:pointer;
    }
    .top-btn:hover { background:#2b3863 }

    /* Layout */
    #content { width:100%; max-width:900px; margin:24px auto; padding:0 16px; display:flex; flex-direction:column; gap:20px; }

    .panel {
      background:var(--panel); border:1px solid #223052; border-radius:14px; padding:14px;
    }
    .panel-title { margin:0 0 10px 0; font-size:16px; font-weight:600 }

    #clock-time { font-size:28px; font-weight:700; margin-top:10px }

    #notes-textarea {
      width:100%; min-height:120px; background:#0f162a; color:var(--text);
      border:1px solid #25345a; border-radius:10px; padding:10px;
    }

    /* Footer */
    #footer { margin:24px auto; padding:10px 16px; color:#92a2c9; font-size:12px }
    #footer a { color:#92a2c9; text-decoration:none; cursor:pointer }
  </style>
</head>

<body>

<header id="topbar">
  <div id="topbar-logo">FX</div>
  <div id="topbar-title">Flux [DEV VERSION]</div>
  <div id="topbar-spacer"></div>
  <button class="top-btn" id="btn-refresh">Refresh</button>
  <button class="top-btn" id="btn-theme">Toggle Theme</button>
  <button class="top-btn" id="btn-back">Back</button>
</header>

<div id="content">

  <div class="panel">
    <h2 class="panel-title">Clock Settings</h2>
    <button id="toggle-ms">Toggle Milliseconds</button>
    <button id="toggle-sec">Toggle Seconds</button>
    <div id="clock-time"></div>
  </div>

  <div class="panel">
    <h2 class="panel-title">Notes</h2>
    <textarea id="notes-textarea"></textarea>
  </div>

</div>

<div id="footer">
  <a id="reset-all">Reset all settings</a>
</div>

<script>
/* ---------------------------------------------------------
   GLOBAL SETTINGS MANAGER
--------------------------------------------------------- */
const FluxSettings = {
  load() {
    return JSON.parse(localStorage.getItem("flux-settings") || "{}");
  },
  save(obj) {
    localStorage.setItem("flux-settings", JSON.stringify(obj));
  },
  set(key, value) {
    const data = this.load();
    data[key] = value;
    this.save(data);
  },
  get(key, fallback = null) {
    const data = this.load();
    return data[key] ?? fallback;
  }
};

/* ---------------------------------------------------------
   THEME SYSTEM
--------------------------------------------------------- */
function applyTheme(mode) {
  if (mode === "light") {
    document.documentElement.style.setProperty('--bg', '#f4f6fb');
    document.documentElement.style.setProperty('--panel', '#ffffff');
    document.documentElement.style.setProperty('--text', '#1b2338');
    document.documentElement.style.setProperty('--muted', '#5c6b92');
  } else {
    document.documentElement.style.setProperty('--bg', '#0f1320');
    document.documentElement.style.setProperty('--panel', '#1a2033');
    document.documentElement.style.setProperty('--text', '#e8eefc');
    document.documentElement.style.setProperty('--muted', '#aab4d4');
  }
}

applyTheme(FluxSettings.get("theme", "dark"));

document.getElementById("btn-theme").addEventListener("click", () => {
  const current = FluxSettings.get("theme", "dark");
  const next = current === "dark" ? "light" : "dark";
  FluxSettings.set("theme", next);
  applyTheme(next);
});

/* ---------------------------------------------------------
   CLOCK SETTINGS
--------------------------------------------------------- */
document.getElementById("toggle-ms").addEventListener("click", () => {
  FluxSettings.set("clock-ms", !FluxSettings.get("clock-ms", false));
});

document.getElementById("toggle-sec").addEventListener("click", () => {
  FluxSettings.set("clock-sec", !FluxSettings.get("clock-sec", true));
});

function updateClock() {
  const showMs = FluxSettings.get("clock-ms", false);
  const showSec = FluxSettings.get("clock-sec", true);

  const now = new Date();
  let t = now.getHours().toString().padStart(2, "0") + ":" +
          now.getMinutes().toString().padStart(2, "0");

  if (showSec) t += ":" + now.getSeconds().toString().padStart(2, "0");
  if (showMs) t += "." + now.getMilliseconds().toString().padStart(3, "0");

  document.getElementById("clock-time").textContent = t;
}
setInterval(updateClock, 10);
updateClock();

/* ---------------------------------------------------------
   NOTES
--------------------------------------------------------- */
const notesEl = document.getElementById("notes-textarea");
notesEl.value = FluxSettings.get("notes", "");

notesEl.addEventListener("input", e => {
  FluxSettings.set("notes", e.target.value);
});

/* ---------------------------------------------------------
   RESET
--------------------------------------------------------- */
document.getElementById("reset-all").addEventListener("click", () => {
  if (confirm("Reset ALL Flux settings?")) {
    localStorage.removeItem("flux-settings");
    location.reload();
  }
});

/* ---------------------------------------------------------
   NAVIGATION
--------------------------------------------------------- */
document.getElementById("btn-back").addEventListener("click", () => {
  window.location.href = "/Flux/main";
});

document.getElementById("btn-refresh").addEventListener("click", () => {
  location.reload();
});
</script>

</body>
</html>
